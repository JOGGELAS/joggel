  :root{
    --teal:#0f4a5c; --teal2:#0b3a49; --teal3:#145a6e; --red:#e3122b; --cream:#fff8ec;
    --ink:#141414; --yellow:#ffd23f; --pink:#f08ab8; --green:#1f7a4a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:"Nunito",system-ui,-apple-system,sans-serif;color:var(--ink);overflow-x:hidden;min-height:100vh;
    background:var(--teal2);
  }
  /* Spiral-bakgrunn inspirert av logoen */
  .bg{position:fixed;inset:-50vmax;z-index:-1;
    background:repeating-radial-gradient(circle at 50% 50%, var(--teal) 0 46px, var(--teal2) 46px 92px);
    animation:spin 120s linear infinite}
  @keyframes spin{to{transform:rotate(360deg) scale(1.02)}}
  .vignette{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.45) 100%)}

  header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;max-width:720px;margin:0 auto}
  .brand{font-family:"Lilita One",sans-serif;font-size:26px;color:#fff;letter-spacing:1px;
    text-shadow:3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);transform:rotate(-3deg)}
  .brand b{color:var(--red);font-weight:400}
  .sound{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:6px 12px;font-size:16px;cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);font-family:inherit;font-weight:800}

  /* Løpebane-fremdrift */
  .track{max-width:720px;margin:14px auto 0;padding:0 18px;position:relative;height:44px}
  .lane{position:absolute;left:18px;right:18px;top:24px;height:12px;background:#fff;border:3px solid var(--ink);border-radius:99px;overflow:hidden}
  .lane i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--red) 0 10px,#ff4a5c 10px 20px);transition:width .6s cubic-bezier(.3,1.4,.5,1)}
  .runner{position:absolute;top:-2px;left:18px;font-size:30px;transition:left .6s cubic-bezier(.3,1.4,.5,1);transform:scaleX(-1)}
  .runner.hop{animation:hop .35s ease}
  @keyframes hop{50%{transform:scaleX(-1) translateY(-10px)}}
  .flag{position:absolute;right:10px;top:-4px;font-size:28px}

  main{max-width:720px;margin:0 auto;padding:18px 18px 60px}
  .card{background:var(--cream);border:4px solid var(--ink);border-radius:26px;box-shadow:8px 8px 0 var(--ink);padding:26px 22px 22px;position:relative}
  .screen{animation:in .5s cubic-bezier(.3,1.5,.5,1)}
  .screen.out{animation:out .22s ease-in forwards}
  @keyframes in{from{opacity:0;transform:translateY(40px) rotate(2deg) scale(.95)}to{opacity:1;transform:none}}
  @keyframes out{to{opacity:0;transform:translateX(-60px) rotate(-4deg)}}

  .step{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:99px;padding:3px 12px;
    font-weight:900;font-size:13px;letter-spacing:.5px;transform:rotate(-2deg);margin-bottom:12px}
  h1,h2{font-family:"Lilita One",sans-serif;font-weight:400;line-height:1.05;letter-spacing:.3px}
  h1{font-size:clamp(34px,7vw,52px);margin-bottom:12px}
  h2{font-size:clamp(28px,6vw,40px);margin-bottom:6px}
  h1 em,h2 em{font-style:normal;color:var(--red)}
  .sub{font-size:17px;font-weight:600;color:#4a4a4a;margin-bottom:20px;line-height:1.45}

  .opts{display:grid;gap:12px;grid-template-columns:1fr 1fr}
  .opts.one{grid-template-columns:1fr}
  .opts.three{grid-template-columns:repeat(3,1fr)}
  .opt{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:18px;
    box-shadow:4px 4px 0 var(--ink);padding:13px 14px;font-family:inherit;font-size:16px;font-weight:800;color:var(--ink);
    cursor:pointer;text-align:left;transition:transform .12s, box-shadow .12s, background .15s;line-height:1.2}
  .opt:nth-child(odd){transform:rotate(-.6deg)} .opt:nth-child(even){transform:rotate(.6deg)}
  .opt:hover{transform:translate(-2px,-2px) rotate(0);box-shadow:6px 6px 0 var(--ink);background:#fffbe0}
  .opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .opt.sel{background:var(--yellow);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .opt .em{font-size:28px;flex-shrink:0;display:inline-block}
  .opt:hover .em{animation:wig .4s ease}
  @keyframes wig{25%{transform:rotate(-14deg) scale(1.15)}75%{transform:rotate(14deg) scale(1.15)}}
  .opts.three .opt{flex-direction:column;text-align:center;padding:16px 8px}
  .opts.three .opt .em{font-size:36px}

  .btn{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:99px;
    box-shadow:5px 5px 0 var(--ink);padding:14px 30px;font-family:"Lilita One",sans-serif;font-size:24px;letter-spacing:.5px;cursor:pointer;
    transition:transform .1s, box-shadow .1s}
  .btn:hover{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:7px 7px 0 var(--ink)}
  .btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
  .btn.pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.05) rotate(-1deg)}}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:22px;gap:12px;flex-wrap:wrap}
  .back{background:none;border:0;font-family:inherit;font-weight:800;font-size:15px;color:#666;cursor:pointer;padding:8px 2px}
  .back:hover{color:var(--ink)}

  .hero{width:100%;border:4px solid var(--ink);border-radius:20px;display:block;margin:-6px 0 18px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-1.2deg)}
  .privacy{background:#e9f4f6;border:3px dashed var(--teal);border-radius:16px;padding:14px 16px;font-size:14.5px;font-weight:600;line-height:1.5;color:#244;margin:18px 0 20px}
  .privacy b{display:block;font-weight:900;margin-bottom:4px;color:var(--teal)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .chip{background:#fff;border:3px solid var(--ink);border-radius:99px;padding:5px 12px;font-weight:900;font-size:14px}
  .chip:nth-child(1){transform:rotate(-2deg);background:var(--pink)} .chip:nth-child(2){transform:rotate(1.5deg);background:#bde7c9} .chip:nth-child(3){transform:rotate(-1deg);background:var(--yellow)}

  /* Slider */
  .rate{text-align:center;padding:6px 0 4px}
  .rate .face{font-size:84px;line-height:1;display:inline-block;transition:transform .2s}
  .rate .num{font-family:"Lilita One",sans-serif;font-size:56px;color:var(--red);-webkit-text-stroke:2px var(--ink);margin:4px 0 2px}
  .rate .lbl{font-weight:800;font-size:17px;min-height:24px;margin-bottom:16px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:linear-gradient(90deg,#9ad 0%,var(--yellow) 50%,var(--red) 100%);
    border:3px solid var(--ink);border-radius:99px;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:42px;height:42px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:grab}
  input[type=range]::-moz-range-thumb{width:36px;height:36px;border-radius:50%;background:#fff;border:4px solid var(--ink);cursor:grab}

  .other{display:none;margin-top:14px;gap:10px;align-items:stretch;flex-wrap:wrap;animation:in .35s cubic-bezier(.3,1.5,.5,1)}
  .other.show{display:flex}
  .other input{flex:1;min-width:200px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);
    font:inherit;font-weight:700;font-size:17px;padding:12px 14px;color:var(--ink)}
  .other input:focus{outline:none;background:#fffbe0}
  .other .btn{font-size:20px;padding:10px 22px}
  textarea{width:100%;min-height:110px;background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);
    font:inherit;font-weight:700;font-size:17px;padding:14px 16px;resize:vertical;color:var(--ink)}
  textarea:focus{outline:none;background:#fffbe0}

  /* Snakkeboble-reaksjon fra gutta */
  .bubble{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);display:flex;align-items:center;gap:10px;z-index:20;
    transition:transform .35s cubic-bezier(.3,1.6,.5,1);pointer-events:none}
  .bubble.show{transform:translateX(-50%) translateY(0)}
  .bubble img{width:62px;height:62px;border-radius:50%;border:4px solid var(--ink);box-shadow:3px 3px 0 var(--ink);object-fit:cover;background:var(--red)}
  .bubble span{background:#fff;border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 16px;font-weight:900;font-size:17px;box-shadow:3px 3px 0 var(--ink);max-width:calc(100vw - 110px)}
  .bubble{width:max-content}

  .end-photo{width:100%;max-height:420px;object-fit:cover;object-position:center 40%;border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);display:block;transform:rotate(1.5deg);margin:6px 0 20px}
  .stamp{position:absolute;top:-22px;right:-10px;background:var(--red);color:#fff;font-family:"Lilita One",sans-serif;font-size:20px;
    border:4px solid var(--ink);border-radius:14px;padding:6px 14px;transform:rotate(8deg);box-shadow:4px 4px 0 var(--ink);animation:stamp .5s .3s both cubic-bezier(.3,1.8,.5,1)}
  @keyframes stamp{from{transform:rotate(30deg) scale(3);opacity:0}to{transform:rotate(8deg) scale(1);opacity:1}}
  .fine{font-size:14px;font-weight:700;color:#555;margin-top:14px}
  canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

  @media (max-width:520px){
    .opts{grid-template-columns:1fr}
    .opts.keep2{grid-template-columns:1fr 1fr}
    .opts.three{grid-template-columns:repeat(3,1fr)}
    .opts.three .opt{font-size:14px}
    .card{padding:22px 16px 18px;box-shadow:6px 6px 0 var(--ink)}
  }
</style>
</head>
<body>
<div class="bg"></div><div class="vignette"></div>
<header>
  <div class="brand">JØGGEL <b>AS</b></div>
  <button class="sound" id="sound" aria-label="Lyd av/på">🔊</button>
</header>
<div class="track" id="track" style="visibility:hidden">
  <div class="lane"><i id="bar"></i></div>
  <div class="runner" id="runner">🏃</div>
  <div class="flag">🏁</div>
</div>
<main id="main"></main>
<div class="bubble" id="bubble"><img id="bubImg" alt=""><span id="bubTxt"></span></div>
<canvas id="confetti"></canvas>

/* ============ LYD ============ */
let soundOn = true, actx;
function blip(f=520, d=.09, type="square", v=.05){
  if(!soundOn) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f*1.8,actx.currentTime+d); g.gain.setValueAtTime(v,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d);
  }catch(e){}
}
document.getElementById("sound").onclick = e => { soundOn=!soundOn; e.target.textContent = soundOn?"🔊":"🔇"; };

/* ============ MOTOR ============ */
const main = document.getElementById("main");
let A = {}, idx = -1, hist = [];
const visible = () => Q.filter(q => !q.showIf || q.showIf(A));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function setProgress(){
  const track = document.getElementById("track");
  track.style.visibility = idx < 0 ? "hidden" : "visible";
  const v = visible(), done = idx >= Q.length ? 1 : Math.max(0, v.indexOf(Q[idx])) / v.length;
  document.getElementById("bar").style.width = (done*100)+"%";
  const r = document.getElementById("runner");
  r.style.left = `calc(18px + ${done} * (100% - 36px - 34px))`;
  r.classList.remove("hop"); void r.offsetWidth; r.classList.add("hop");
}
function swap(html, after){
  const old = main.firstElementChild;
  const go = () => { main.innerHTML = '<div class="screen">'+html+'</div>'; after && after(); setProgress(); window.scrollTo({top:0,behavior:"smooth"}); };
  if (old){ old.classList.add("out"); setTimeout(go, 200); } else go();
}
let bt;
function bubble(t, who){
  if (who == null) who = Math.floor(Math.random()*2);
  document.getElementById("bubImg").src = IMG.a[who];
  document.getElementById("bubTxt").textContent = t;
  const b = document.getElementById("bubble"); b.classList.add("show");
  clearTimeout(bt); bt = setTimeout(()=>b.classList.remove("show"), 1100);
}

function intro(){
  idx = -1;
  swap(`<div class="card">
    <img class="hero" src="${IMG.logo}" alt="JØGGEL AS">
    <div class="chips"><span class="chip">⏱️ ca. 1 min</span><span class="chip">🕶️ Anonymt</span><span class="chip">🙏 Hjelper oss masse</span></div>
    <h1 style="margin-top:12px">Hvem i all verden <em>hører</em> på oss?!</h1>

    <button class="btn pulse" id="start">Kjør på! 🚀</button>
  </div>`, () => document.getElementById("start").onclick = () => { blip(400,.15,"triangle",.08); next(); });
}

function next(){
  let i = idx + 1;
  while (i < Q.length && Q[i].showIf && !Q[i].showIf(A)) i++;
  if (idx >= 0) hist.push(idx);
  idx = i;
  i >= Q.length ? finish() : render();
}
function back(){ blip(300,.06); if (!hist.length) return intro(); idx = hist.pop(); render(); }

function stepLabel(){ const v = visible(); return `SPØRSMÅL ${v.indexOf(Q[idx])+1} AV ${v.length}`; }

function render(){
  const q = Q[idx];
  const head = `<span class="step">${stepLabel()}</span><h2>${q.title}</h2>${q.sub?`<p class="sub">${q.sub}</p>`:'<div style="height:14px"></div>'}`;
  const backBtn = `<button class="back" id="back">← Tilbake</button>`;

  if (q.type === "text"){
    swap(`<div class="card">${head}<textarea id="ta" maxlength="400" placeholder="F.eks. «Få med bestemora mi» …">${esc(A[q.id]||"")}</textarea>
      <div class="row">${backBtn}<button class="btn" id="go">Send inn! 🎉</button></div></div>`, () => {
      document.getElementById("back").onclick = back;
      document.getElementById("go").onclick = () => { A[q.id] = document.getElementById("ta").value.trim(); blip(600,.2,"triangle",.08); next(); };
    });
    return;
  }

  if (q.type === "rate"){
    const v = A[q.id] || 5;
    swap(`<div class="card">${head}<div class="rate">
        <div class="face" id="face">${RATE[v][0]}</div>
        <div class="num" id="num">${v}</div>
        <div class="lbl" id="lbl">${RATE[v][1]}</div>
        <input type="range" min="0" max="10" value="${v}" id="rng" aria-label="Vurdering 0 til 10">
      </div><div class="row">${backBtn}<button class="btn" id="go">Neste →</button></div></div>`, () => {
      const r = document.getElementById("rng"); let last = v;
      r.oninput = () => { const n=+r.value; if(n!==last){ blip(300+n*60,.05,"square",.03); last=n; }
        document.getElementById("face").textContent = RATE[n][0];
        document.getElementById("face").style.transform = `scale(${1+n*.03}) rotate(${(n-5)*3}deg)`;
        document.getElementById("num").textContent = n; document.getElementById("lbl").textContent = RATE[n][1]; };
      document.getElementById("back").onclick = back;
      document.getElementById("go").onclick = () => { A[q.id] = +r.value; bubble(+r.value>=8?"Æsj, takk da 🥹":"Takk for ærligheten!"); blip(500,.12); setTimeout(next,350); };
    });
    return;
  }

  const cur = A[q.id] || "";
  const isSel = o => cur === o[1] || (o[3] && cur.startsWith(o[1]+": "));
  const otherOpt = q.options.find(o => o[3]);
  const otherTxt = otherOpt && cur.startsWith(otherOpt[1]+": ") ? cur.slice(otherOpt[1].length+2) : "";
  const opts = q.options.map((o,n) => `<button class="opt${isSel(o)?" sel":""}" data-v="${esc(o[1])}"${o[3]?' data-other="1"':""}>
      <span class="em">${o[0]}</span><span>${o[1]}${o[2]?`<br><small style="font-weight:700;color:#666;font-size:13px">${o[2]}</small>`:""}</span></button>`).join("");
  swap(`<div class="card">${head}<div class="opts ${q.cls||""}">${opts}</div>
    ${otherOpt?`<div class="other${otherOpt&&isSel(otherOpt)?" show":""}" id="other"><input id="otherIn" maxlength="120" placeholder="${({jobb:"Hva driver du med?",fag:"Hvilket fag?",utdanning:"Hva tar du?",hvor:"Hvor hører du på oss?"})[q.id]||"Skriv her …"}" value="${esc(otherTxt)}"><button class="btn" id="otherGo">Neste →</button></div>`:""}
    <div class="row">${backBtn}</div></div>`, () => {
    document.getElementById("back").onclick = back;
    main.querySelectorAll(".opt").forEach(b => b.onclick = () => b.dataset.other ? openOther(q, b) : pick(q, b));
    if (otherOpt){
      const go = () => {
        const txt = document.getElementById("otherIn").value.trim();
        setAnswer(q, txt ? otherOpt[1]+": "+txt : otherOpt[1]);
        blip(500,.12); react(q.id); setTimeout(next, 450);
      };
      document.getElementById("otherGo").onclick = go;
      document.getElementById("otherIn").onkeydown = e => { if (e.key === "Enter") go(); };
    }
  });
}

let locked = false;
function setAnswer(q, v){
  if (A[q.id] !== v){ A[q.id] = v; Q.forEach(x => { if (x.showIf && !x.showIf(A)) delete A[x.id]; }); }
}
function openOther(q, b){
  main.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
  b.classList.add("sel"); blip(380,.08);
  const o = document.getElementById("other"); o.classList.add("show");
  const inp = document.getElementById("otherIn"); inp.focus();
  o.scrollIntoView({behavior:"smooth", block:"center"});
}
function pick(q, b){
  if (locked) return; locked = true;
  main.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
  b.classList.add("sel");
  setAnswer(q, b.dataset.v);
  const o = document.getElementById("other"); if (o) o.classList.remove("show");
  blip(440 + Math.random()*200);
  react(q.id);
  setTimeout(() => { locked = false; next(); }, 520);
}

document.addEventListener("keydown", e => {
  if (idx < 0 || idx >= Q.length || Q[idx].type || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  const n = parseInt(e.key, 10), btns = main.querySelectorAll(".opt");
  if (n >= 1 && n <= btns.length) btns[n-1].click();
});

function kategori(a){
  if (BYGG.includes(a.jobb)) return "Bygg/håndverk";
  if (["Yrkesfag – bygg","Yrkesfag – elektro"].includes(a.utdanning)) return "Bygg-elev";
  return "Annet";
}

async function finish(){
  idx = Q.length; hist = [];
  const payload = Object.assign({ tidspunkt:new Date().toISOString(), kategori:kategori(A) },
    Object.fromEntries(Q.map(q => [q.id, A[q.id] ?? ""])));
  swap(`<div class="card"><div class="stamp">FERDIG! ✅</div>
    <h1>Tusen takk – du er en <em>legende!</em></h1>
    <img class="end-photo" src="${IMG.studio}" alt="Gutta i JØGGEL-studioet">
    <p class="sub">Hilsen oss i studio 🦒 Dette hjelper oss mer enn du aner.</p>
    <p class="fine" id="status">Sender svaret ditt …</p>
  </div>`, () => {
    confetti(); [523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.18,"triangle",.07),i*110));
  });
  const st = () => document.getElementById("status");
  if (!SHEET_URL){ console.log("JØGGEL-svar (demo):", JSON.stringify(payload)); setTimeout(()=>{ if(st()) st().textContent="Svaret ditt er registrert ✅"; },600); return; }
  try{
    await fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    if (st()) st().textContent = "Svaret ditt er registrert ✅";
  }catch(e){ if (st()) st().textContent = "Oi, noe gikk galt med sendingen. Prøv å laste siden på nytt."; }
}

function confetti(){
  const c = document.getElementById("confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e3122b","#ffd23f","#ffffff","#f08ab8","#1f7a4a","#3fb6d0"];
  const P = Array.from({length:180}, () => ({ x:Math.random()*c.width, y:-20-Math.random()*c.height*.6, r:6+Math.random()*8,
    vx:-2+Math.random()*4, vy:2+Math.random()*4, a:Math.random()*6, va:-.25+Math.random()*.5, c:cols[Math.floor(Math.random()*cols.length)] }));
  let t = 0;
  (function f(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.a+=p.va; x.save(); x.translate(p.x,p.y); x.rotate(p.a);
      x.fillStyle=p.c; x.strokeStyle="#141414"; x.lineWidth=1.5; x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.strokeRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if (++t < 300) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height);
  })();
}

intro();
</script>
